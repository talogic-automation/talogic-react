# Generated by smith from the workspace's projects. `smith add` and `smith ci generate`
# rewrite this file: put your own steps between the smith:slot markers, which are kept.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  deployments: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache the npm download store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: smith-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            smith-npm-${{ runner.os }}-
      - name: Cache the smith the launcher downloads
        uses: actions/cache@v4
        with:
          path: ~/.smith/versions
          key: smith-versions-${{ runner.os }}-${{ runner.arch }}-3.0.0
      - name: Install smith
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm install --global --registry https://registry.npmjs.org/ monosmith@^3 && SMITH_VERSION=3.0.0 smith --version
          smith --version
      # smith:slot before-setup
      # smith:slot-end before-setup
      - name: Setup
        run: smith ci setup
      - name: Audit
        run: smith ci audit
      - name: Verify
        run: smith ci verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # smith:slot after-verify
      # smith:slot-end after-verify
      - name: Release preview
        if: github.event_name == 'pull_request'
        run: smith release --dry-run --comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: smith ci release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
