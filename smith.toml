#:schema https://raw.githubusercontent.com/monosmith-app/monosmith/main/apps/smith/features/workspace/smith.schema.json
# smith workspace configuration. Every setting below has a default; most
# workspaces need nothing more than a name. See https://github.com/monosmith-app/monosmith/blob/main/docs/reference/configuration.md.
schema = 1

[workspace]
name = "talogic-react"
# The defaults vintage this workspace was made with; a newer smith keeps it
# until smith upgrade --defaults adopts a newer one.
defaults = "2026.11"
# The word every language puts before a new project's name (acme-core, @acme/core,
# Acme.Core). Default: the workspace name. The scope and module_prefix derive from it.
# namespace = "adopt"
# npm scope for Node packages. Default: @ and the namespace.
scope = "@talogic-automation"
# Go module path prefix for Go projects
module_prefix = "github.com/talogic-automation/talogic-react"

[ci]
# Pipelines to generate: "github", "azure", "gitlab", "circleci", "bitbucket", or several.
providers = ["github"]
# A dev container (.devcontainer/devcontainer.json) with the toolchains CI
# installs, at the same versions.
devcontainer = true

[dependencies]
# One version per production dependency across the workspace, and dev tools at
# the root, once: smith doctor reports a dependency two projects declare at
# different versions, and smith deps up --align brings it to one.
one_version = true
# Dependencies that may differ between projects: allow = ["left-pad"]

# A stack is the set of plugins a project is built with: its language plugin
# and the toolchain, structure, scaffold and deploy plugins on top. Each
# project records its own, so one monorepo can mix them; `smith stacks` lists
# them and `smith add app web --stack node-vitest` picks one. Projects that record
# none use the default of their language. See https://github.com/monosmith-app/monosmith/blob/main/docs/reference/stacks.md.
[default_stacks]
node = "node-jest"     # ESLint with @monosmith/eslint-config, and Jest

# [stacks.node-quick]
# description = "Vitest only, no lint"
# language = "node"
# toolchain = ["vitest"]

# Conventions apply a plugin to every project of the languages it supports.
# vertical-slices gives Go, Python, Dart, Rust, Ruby, C++, .NET, JVM and PHP
# projects a slice-check task, run before lint (role-named files, no
# junk-drawer folders), and has smith doctor check that Node projects' ESLint
# config loads the same rules. See https://github.com/monosmith-app/monosmith/blob/main/docs/reference/conventions.md.
[conventions.vertical-slices]

# The package is published to the GitHub Packages npm registry of the organisation, with the workflow's GITHUB_TOKEN.
[registries.github]
npm = "https://npm.pkg.github.com"
auth = "github-packages"

# Every merge to main releases from the conventional commits: smith sets the version, tags, publishes and writes
# the GitHub Release.
[release]
registry = "github"
github_releases = true

# [cache]
# dir = ".smith/cache"
# max_size_mb = 2048

# Override any task a plugin infers, for every project or for one:
# [tasks.test]
# cache = false
# [projects.web.tasks.build]
# depends_on = ["^build", "codegen"]
